<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAVELY TAP UC</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body {
    margin: 0;
    padding: 25px;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}
.panel {
    background: #222;
    padding: 22px;
    margin: 18px 0;
    border-radius: 15px;
}
h1 { color: #ff4545; }
button {
    background: #ff4545;
    color: white;
    border: 0;
    padding: 15px 25px;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    width: 100%;
}
#tapButton { height: 100px; font-size: 25px; }
</style>
</head>
<body>

<h1>🔥 LAVELY TAP UC</h1>

<div class="panel">
    <h3>💰 BALANS</h3>
    <h1 id="balance">0 UC</h1>
    <button id="tapButton" onclick="tap()">👆 TAP</button>
    <p id="status">Yuklanmoqda...</p>
</div>

<div class="panel">
    <h3>🎁 REFERAL</h3>
    <p>Har bir yangi taklif uchun +1 UC</p>
    <button onclick="share()">DO‘STNI TAKLIF QILISH</button>
</div>

<script>
const API = "https://lavely-tap.onrender.com";
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const initData = tg.initData;

async function request(endpoint) {
    const response = await fetch(API + endpoint, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({initData})
    });

    if (!response.ok) throw new Error("Server xatosi");
    return await response.json();
}

async function loadBalance() {
    try {
        const data = await request("/balance");
        const player = data.data || data;
        document.getElementById("balance").innerText =
            (player.balance ?? 0) + " UC";
        document.getElementById("status").innerText = "O‘yin tayyor!";
    } catch (e) {
        document.getElementById("status").innerText =
            "Balans yuklanmadi. Qayta urinib ko‘ring.";
    }
}

async function registerReferral() {
    const ref = new URLSearchParams(location.search).get("ref");

    if (!ref || !/^\d+$/.test(ref) || !initData) return;

    try {
        await request("/referral?referrer_id=" + encodeURIComponent(ref));
    } catch (e) {
        console.log("Referal xatosi:", e);
    }
}

async function tap() {
    try {
        document.getElementById("tapButton").disabled = true;
        await request("/tap");
        await loadBalance();
    } catch (e) {
        document.getElementById("status").innerText = "Tap amalga oshmadi!";
    } finally {
        document.getElementById("tapButton").disabled = false;
    }
}

function share() {
    const userId = tg.initDataUnsafe?.user?.id;

    if (!userId) {
        tg.showAlert("Bot orqali o‘yinni oching!");
        return;
    }

    const link = "https://t.me/LAVELYUC_BOT?start=" + userId;
    const shareUrl = "https://t.me/share/url?url=" +
        encodeURIComponent(link) +
        "&text=" + encodeURIComponent("LAVELY TAP UC o‘yiniga qo‘shil!");

    tg.openTelegramLink(shareUrl);
}

async function startGame() {
    await registerReferral();
    await loadBalance();
}

startGame();
</script>
</body>
</html>
